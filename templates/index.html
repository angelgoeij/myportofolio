{% extends 'base.html' %} {% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {{name}} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    
</head>
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker"> {{npm}} &middot; PBP A &middot; {{study_program}} </p>
                    <h1> {{name}} </h1>
                </div>
                <div class="hero-photo">
                    <div class=""></div>
                    <img class="avatar" src="/static/img/retrostrawberry.png" alt="Photo of Goeij Angelatika Goeyanto">
                </div>
                <div class="hero-details">
                    <p class="bio"> {{bio}} </p>
                    <dl class="meta-list">
    
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/angelgoeij/" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/goeij-angelatika/" class="social-link">LinkedIn</a>
                        <a href="mailto:angelatika2000@gmail.com" class="social-link">Email</a>
                        <a href="https://www.instagram.com/angelgoeij/" class="social-link">Instagram</a>
                    </div>
                </div>
            </div>
        </section>
            <div class="section-border">
            </div>
            <section class="contact-section" id="contact">
            <div class="container">
                <h2>Contact Me</h2>
                
                <form method="POST" class="contact-form">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit">Send Message</button>
                </form>
            </div>
        </section>
    </main>
    {% endblock content %}
</html>
