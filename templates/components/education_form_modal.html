<div id="add-education-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-education-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-education-modal"
            popovertargetaction="hide"
            aria-label="Close add education form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-education-modal"
                popovertargetaction="hide"
                aria-label="Close add education form">×</button>

        <h2 id="add-education-modal-title">Add a New Education</h2>

        <form id="education-form" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-education-modal"
                        popovertargetaction="hide">
                    Cancel
                </button>

                <button type="submit" class="button">
                    Add Education
                </button>
            </div>
        </form>
    </div>
</div>
<div id="edit-education-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-education-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-education-modal"
            popovertargetaction="hide"
            aria-label="Close edit education form"></button>
    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-education-modal"
                popovertargetaction="hide"
                aria-label="Close edit education form">
        </button>
        <h2 id="edit-education-modal-title">Edit Education</h2>
        <form id="edit-education-form" class="project-form">
            {% csrf_token %}
            <input type="hidden" id="edit-education-id">
            <div class="form-group">
                <label for="edit-education-title">Title</label>
                <input type="text"
                       id="edit-education-title"
                       name="title"
                       maxlength="255"
                       required>
            </div>
            <div class="form-group">
                <label for="edit-education-description">Description</label>
                <textarea id="edit-education-description"
                          name="description"
                          required></textarea>
            </div>
            <div class="form-group">
                <label for="edit-education-year">Year</label>
                <input type="text"
                       id="edit-education-year"
                       name="year"
                       maxlength="4"
                       required>
            </div>
            <div class="form-group">
                <label for="edit-education-url">Education URL</label>
                <input type="url"
                       id="edit-education-url"
                       name="education_url">
            </div>
            <div class="form-group">
                <label for="edit-education-image-url">
                    Education Image URL
                </label>
                <input type="url"
                       id="edit-education-image-url"
                       name="education_image_url">
            </div>
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-education-modal"
                        popovertargetaction="hide">
                    Cancel
                </button>
                <button type="submit" class="button">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
