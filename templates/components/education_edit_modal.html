<div id="edit-education-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-education-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-education-modal"
            popovertargetaction="hide"
            aria-label="Close edit education form"></button>

    <div class="project-form-modal__content">

        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-education-modal"
                popovertargetaction="hide"
                aria-label="Close edit education form">×</button>

        <h2 id="edit-education-modal-title">Edit Education</h2>

        <form id="edit-education-form" class="project-form">

            {% csrf_token %}

            <input type="hidden" id="edit-education-id">

            <div class="form-group">
                <label for="edit-title">Title</label>
                <input type="text" id="edit-title" required>
            </div>

            <div class="form-group">
                <label for="edit-description">Description</label>
                <textarea id="edit-description" required></textarea>
            </div>

            <div class="form-group">
                <label for="edit-year">Year</label>
                <input type="text" id="edit-year"
                       maxlength="4" required>
            </div>

            <div class="form-group">
                <label for="edit-education-url">Education URL</label>
                <input type="url" id="edit-education-url">
            </div>

            <div class="form-group">
                <label for="edit-image-url">Education Image URL</label>
                <input type="url" id="edit-image-url">
            </div>

            <div class="project-form-modal__actions">

                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-education-modal"
                        popovertargetaction="hide">
                    Cancel
                </button>

                <button type="submit" class="button">
                    Save Changes
                </button>

            </div>
        </form>
    </div>
</div>
